[package]
name = "folio"
version = "0.2.2"
description = "Yerel kişisel kaynak kütüphanesi"
authors = ["Tuna"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "folio"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
unicode-normalization = "0.1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.dev]
debug = 0
incremental = true
